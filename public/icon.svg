<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%" fx="30%" fy="30%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </radialGradient>
    <!-- Glow and Ring Gradient -->
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <!-- Accent Sparkle Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0ea5e9" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.5" />
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Smooth rounded base container -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Outer ambient ring -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="none" stroke="url(#glowGrad)" stroke-width="4" stroke-opacity="0.15" />

  <!-- Center Artwork -->
  <g filter="url(#shadow)">
    <!-- Stylized Compass / Target / Radar Ring -->
    <circle cx="256" cy="240" r="140" fill="none" stroke="url(#glowGrad)" stroke-width="8" stroke-dasharray="12 8" stroke-opacity="0.4" />
    
    <!-- Outer Web Wireframe Window Frame -->
    <rect x="146" y="150" width="220" height="160" rx="16" fill="#1e293b" fill-opacity="0.8" stroke="url(#glowGrad)" stroke-width="6" />
    <!-- Browser Top Bar Buttons -->
    <circle cx="176" cy="172" r="6" fill="#ef4444" />
    <circle cx="196" cy="172" r="6" fill="#f59e0b" />
    <circle cx="216" cy="172" r="6" fill="#10b981" />
    <!-- Browser Window Lines -->
    <line x1="170" y1="205" x2="342" y2="205" stroke="#475569" stroke-width="4" stroke-linecap="round" />
    <line x1="170" y1="230" x2="290" y2="230" stroke="#475569" stroke-width="4" stroke-linecap="round" />
    <line x1="170" y1="255" x2="310" y2="255" stroke="#475569" stroke-width="4" stroke-linecap="round" />
    <line x1="170" y1="280" x2="240" y2="280" stroke="#475569" stroke-width="4" stroke-linecap="round" />

    <!-- Overlapping Magnifying Glass (Search/Scout Icon) with deep glowing handle -->
    <g filter="url(#glow)">
      <!-- Handle -->
      <line x1="310" y1="290" x2="385" y2="365" stroke="url(#glowGrad)" stroke-width="18" stroke-linecap="round" />
      <line x1="318" y1="298" x2="377" y2="357" stroke="#0f172a" stroke-width="6" stroke-linecap="round" />
      
      <!-- Lens Border -->
      <circle cx="270" cy="250" r="65" fill="#06b6d4" fill-opacity="0.1" stroke="url(#glowGrad)" stroke-width="12" />
      
      <!-- Inner lens glow reflection -->
      <path d="M225 225 A 50 50 0 0 1 295 195" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-opacity="0.6" />
    </g>

    <!-- Star / Sparkle Accent in top right -->
    <path d="M370 120 L375 135 L390 140 L375 145 L370 160 L365 145 L350 140 L365 135 Z" fill="url(#accentGrad)" filter="url(#glow)" />
  </g>

  <!-- App Brand Text at the bottom -->
  <text x="256" y="450" font-family="'Inter', system-ui, sans-serif" font-size="28" font-weight="800" fill="#ffffff" letter-spacing="4" text-anchor="middle" opacity="0.9">
    SITESCOUT AI
  </text>
</svg>
